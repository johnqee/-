<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深度研究助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2329; --muted: #6b7280;
    --accent: #2563eb; --accent-ink: #ffffff; --line: #e5e7eb; --ok: #16a34a; --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
  header h1 { font-size: 26px; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .search-row { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 8px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 12px 22px; font-size: 15px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { background: #93b4f5; cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    padding: 8px 14px; font-size: 13px;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  /* 进度 */
  .progress-box { display: none; }
  .progress-box.on { display: block; }
  .phase {
    display: inline-block; font-size: 12px; color: var(--accent);
    background: #e8efff; border-radius: 999px; padding: 3px 10px; margin-bottom: 10px;
  }
  .progress-msg { font-size: 15px; margin: 4px 0 12px; }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 30%; background: var(--accent);
    border-radius: 999px; animation: slide 1.2s infinite ease-in-out;
  }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .stats { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .stats b { color: var(--ink); }
  /* 报告 */
  .report-box { display: none; }
  .report-box.on { display: block; }
  .report-box .toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  .report-box .toolbar .grow { flex: 1; }
  .badge { font-size: 12px; border-radius: 999px; padding: 3px 10px; }
  .badge.ok { color: var(--ok); background: #e7f7ec; }
  .badge.warn { color: #b45309; background: #fef3c7; }
  article {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px 32px; line-height: 1.85; font-size: 15px;
  }
  article h1 { font-size: 22px; border-bottom: 2px solid var(--line); padding-bottom: 10px; }
  article h2 { font-size: 18px; margin-top: 28px; border-left: 4px solid var(--accent); padding-left: 10px; }
  article h3 { font-size: 16px; }
  article a { color: var(--accent); text-decoration: none; }
  article code { background: #f1f3f5; padding: 1px 6px; border-radius: 4px; }
  details {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 18px; margin-top: 16px; font-size: 13px;
  }
  details summary { cursor: pointer; font-weight: 600; }
  pre {
    background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px;
    overflow: auto; font-size: 12px; line-height: 1.6;
  }
  .err { color: var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 深度研究助手</h1>
    <p>输入一个研究主题，自动完成「规划 → 多轮检索 → 阅读抽取 → 缺口判断 → 综合报告」，产出带来源引用的结构化研究报告。</p>
  </header>

  <div class="card">
    <div class="search-row">
      <input id="topic" type="text"
             placeholder="例如：2026 年国内大模型 Agent 开发框架对比"
             onkeydown="if(event.key==='Enter') startResearch()">
      <button id="btn" onclick="startResearch()">开始研究</button>
    </div>
    <div class="hint">一次研究约需 2~5 分钟，会在 output/ 目录落盘 report.md 与 process.json。</div>
  </div>

  <div class="card progress-box" id="progressBox">
    <span class="phase" id="phase">规划中</span>
    <div class="progress-msg" id="progressMsg">正在启动…</div>
    <div class="bar"><i></i></div>
    <div class="stats">
      <span>检索轮次 <b id="statRound">0</b></span>
      <span>已读来源 <b id="statSources">0</b></span>
      <span>检索次数 <b id="statQueries">0</b></span>
    </div>
  </div>

  <div class="report-box" id="reportBox">
    <div class="toolbar">
      <span class="grow"></span>
      <span class="badge ok" id="citeBadge" style="display:none"></span>
      <button class="ghost" onclick="downloadReport()">下载 report.md</button>
    </div>
    <article id="report"></article>
    <details>
      <summary>研究过程记录（process.json）</summary>
      <pre id="process"></pre>
    </details>
  </div>
</div>

<script>
let taskId = null;
let timer = null;
let reportMd = "";

async function startResearch() {
  const topic = document.getElementById("topic").value.trim();
  if (!topic) { alert("请输入研究主题"); return; }
  const btn = document.getElementById("btn");
  btn.disabled = true;
  document.getElementById("reportBox").classList.remove("on");
  document.getElementById("progressBox").classList.add("on");
  document.getElementById("progressMsg").textContent = "正在启动…";
  try {
    const r = await fetch("/api/research", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic }),
    });
    if (!r.ok) throw new Error("启动失败：" + await r.text());
    taskId = (await r.json()).task_id;
    timer = setInterval(poll, 2000);
    poll();
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
  }
}

async function poll() {
  if (!taskId) return;
  let data;
  try {
    data = await (await fetch("/api/research/" + taskId)).json();
  } catch (e) { return; }
  const p = data.progress || {};
  document.getElementById("phase").textContent = p.phase || "";
  document.getElementById("progressMsg").textContent = p.message || "";
  document.getElementById("statRound").textContent = p.round || 0;
  document.getElementById("statSources").textContent = p.sources_count || 0;
  document.getElementById("statQueries").textContent = p.queries_done || 0;

  if (data.state === "done") {
    clearInterval(timer);
    document.getElementById("progressBox").classList.remove("on");
    showReport(data);
  } else if (data.state === "error") {
    clearInterval(timer);
    document.getElementById("progressBox").classList.remove("on");
    document.getElementById("btn").disabled = false;
    alert("研究失败：" + data.error);
  }
}

function showReport(data) {
  reportMd = data.report_md || "";
  const box = document.getElementById("reportBox");
  document.getElementById("report").innerHTML = marked.parse(reportMd);
  document.getElementById("process").textContent =
    JSON.stringify(data.process, null, 2);
  const v = data.process && data.process.validation;
  const badge = document.getElementById("citeBadge");
  if (v) {
    badge.style.display = "";
    badge.className = "badge " + (v.passed ? "ok" : "warn");
    badge.textContent = v.passed
      ? "引用校验通过" + (v.rewrote_once ? "（重写一次后）" : "")
      : "引用校验有告警，详见过程记录";
  }
  box.classList.add("on");
  document.getElementById("btn").disabled = false;
}

function downloadReport() {
  const blob = new Blob([reportMd], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "report.md";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
