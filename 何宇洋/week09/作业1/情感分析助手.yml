            {{用户输入}}


            请完成以下任务：

            1. 简要理解用户当前面临的困扰和情绪。

            2. 不要夸大问题，也不要进行医学或心理疾病诊断。

            3. 根据用户描述给出 2～4 条具体、可执行的建议。

            4. 语气自然、简洁、有同理心。

            5. 如果用户只是表达负面情绪但没有明确问题，可以给出适合当前情况的行动建议。


            直接回复用户，不要输出“情感分类”“分析过程”等内部信息。'
