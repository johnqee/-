    - data:
        code: "def extract_text(item) -> str:\n    \"\"\"自动兼容并提取 item 中的文本内容\"\"\"\
          \n    if isinstance(item, str):\n        return item\n    if isinstance(item,\
          \ dict):\n        # 优先提取常见的文本输出 key\n        for key in [\"text\", \"result\"\
          , \"output\", \"content\", \"summary\"]:\n            if key in item and\
          \ isinstance(item[key], str):\n                return item[key]\n      \
          \  # 如果都不是，取字典中第一个非空字符串的值\n        for val in item.values():\n         \
          \   if isinstance(val, str) and val.strip():\n                return val\n\
          \        # 兜底：若包含其他结构，直接转为字符串\n        return str(item)\n    return str(item)\
          \ if item is not None else \"\"\n\ndef main(queries: list, iteration_summaries:\
          \ list) -> dict:\n    sections = []\n    \n    for idx, (query, summary_obj)\
          \ in enumerate(zip(queries, iteration_summaries), start=1):\n        raw_text\
          \ = extract_text(summary_obj)\n        clean_summary = raw_text.strip()\
          \ if raw_text.strip() else \"未获取到有效信息。\"\n        section = f\"### 维度 {idx}：{query}\\\
          n{clean_summary}\"\n        sections.append(section)\n        \n    full_context\
          \ = \"\\n\\n---\\n\\n\".join(sections)\n    return {\"combined_context\"\
          : full_context}"
        code_language: python3
