    - data:
        code: "import json\nimport re\n\ndef main(raw_json: str) -> dict:\n    text\
          \ = raw_json.strip()\n    # 剔除可能存在的 markdown 代码块标记\n    if text.startswith(\"\
          ```\"):\n        text = re.sub(r\"^```(?:json)?\\n\", \"\", text)\n    \
          \    text = re.sub(r\"\\n```$\", \"\", text).strip()\n    \n    try:\n \
          \       queries = json.loads(text)\n        if not isinstance(queries, list):\n\
          \            queries = [str(queries)]\n    except Exception:\n        #\
          \ 正则保底匹配纯文本行\n        queries = [line.strip(\"- *\").strip() for line in\
          \ text.split(\"\\n\") if line.strip()]\n        \n    return {\"json_result\"\
          : queries[:5]}"
